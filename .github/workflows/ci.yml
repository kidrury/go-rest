name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.19-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rest_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rest_pro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rest_pro_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./...

      - name: Run integration tests
        run: go test -tags=integration ./...

      - name: Run race detector
        run: go test -race -tags=integration ./...

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t rest:ci .
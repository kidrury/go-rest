services:
  db:
    image: postgres:15.19-alpine3.24
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres 
      POSTGRES_DB: rest_pro 

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rest_pro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    
  migrate:
    image: migrate/migrate:v4.19.0

    depends_on:
      db:
        condition: service_healthy
    
    volumes:
      - ./migrations:/migrations:ro

    command: [
      "-path=/migrations",
      "-database=postgres://postgres:postgres@db:5432/rest_pro?sslmode=disable",
      "up"
    ]

  api:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/rest_pro?sslmode=disable
      HTTP_ADDR: ":8099"

    depends_on:
      migrate:
        condition: service_completed_successfully

    ports:
      - "8099:8099"

volumes:
  postgres_data:
